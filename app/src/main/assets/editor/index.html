<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Code Editor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1e1e1e;
        }
        #editor-container {
            width: 100%;
            height: 100vh;
        }

        /* Minimap scrollbar styling */
        .monaco-editor .scrollbar.vertical .slider {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Loading indicator */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e1e1e;
            color: #cccccc;
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #333;
            border-top-color: #007acc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loading-spinner"></div>
        <span>Loading editor...</span>
    </div>
    <div id="editor-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.min.js"></script>

    <script>
        // ============================================================
        // Monaco Editor Configuration
        // ============================================================
        const LANGUAGE_MAP = {
            '.js': 'javascript', '.jsx': 'javascript',
            '.ts': 'typescript', '.tsx': 'typescript',
            '.py': 'python',
            '.java': 'java',
            '.kt': 'kotlin', '.kts': 'kotlin',
            '.go': 'go',
            '.rs': 'rust',
            '.rb': 'ruby',
            '.php': 'php',
            '.c': 'c', '.h': 'c',
            '.cpp': 'cpp', '.hpp': 'cpp', '.cc': 'cpp', '.cxx': 'cpp',
            '.cs': 'csharp',
            '.swift': 'swift',
            '.sh': 'shell', '.bash': 'shell', '.zsh': 'shell',
            '.html': 'html', '.htm': 'html',
            '.css': 'css', '.scss': 'scss', '.less': 'less',
            '.json': 'json',
            '.xml': 'xml',
            '.yaml': 'yaml', '.yml': 'yaml',
            '.md': 'markdown', '.mdx': 'markdown',
            '.sql': 'sql',
            '.txt': 'plaintext',
            '.toml': 'plaintext',
            '.ini': 'ini', '.cfg': 'ini',
            '.gradle': 'groovy',
            '.dockerfile': 'dockerfile',
            '.gitignore': 'plaintext',
            '.env': 'plaintext',
            '.conf': 'plaintext'
        };

        function getLanguage(fileName) {
            if (!fileName) return 'plaintext';
            const ext = fileName.substring(fileName.lastIndexOf('.'));
            // Handle special filenames
            const name = fileName.toLowerCase();
            if (name === 'dockerfile') return 'dockerfile';
            if (name === 'makefile') return 'plaintext';
            return LANGUAGE_MAP[ext] || 'plaintext';
        }

        // ============================================================
        // Initialize Monaco
        // ============================================================
        let editor = null;
        let currentModel = null;
        let currentFilePath = '';
        let isModified = false;
        const decorations = [];
        let readOnly = false;

        require.config({
            paths: {
                vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs'
            },
            'vs/nls': {
                availableLanguages: { '*': '' }
            }
        });

        require(['vs/editor/editor.main'], function() {
            // Hide loading indicator
            document.getElementById('loading').classList.add('hidden');

            // Define custom themes
            monaco.editor.defineTheme('terminalcode-dark', {
                base: 'vs-dark',
                inherit: true,
                rules: [
                    { token: 'comment', foreground: '6a9955', fontStyle: 'italic' },
                    { token: 'keyword', foreground: '569cd6' },
                    { token: 'string', foreground: 'ce9178' },
                    { token: 'number', foreground: 'b5cea8' },
                    { token: 'type', foreground: '4ec9b0' },
                    { token: 'function', foreground: 'dcdcaa' },
                    { token: 'variable', foreground: '9cdcfe' },
                    { token: 'constant', foreground: '4fc1ff' },
                    { token: 'regexp', foreground: 'd16969' },
                    { token: 'tag', foreground: '569cd6' }
                ],
                colors: {
                    'editor.background': '#0d1117',
                    'editor.foreground': '#c9d1d9',
                    'editor.lineHighlightBackground': '#161b22',
                    'editor.selectionBackground': '#264f78',
                    'editor.inactiveSelectionBackground': '#264f7844',
                    'editorCursor.foreground': '#c9d1d9',
                    'editorLineNumber.foreground': '#6e7681',
                    'editorLineNumber.activeForeground': '#c9d1d9',
                    'editor.selectionHighlightBackground': '#3b5998',
                    'editorBracketMatch.background': '#2ea04344',
                    'editorBracketMatch.border': '#2ea043',
                    'editorWidget.background': '#161b22',
                    'editorWidget.border': '#30363d',
                    'editorSuggestWidget.background': '#161b22',
                    'editorSuggestWidget.border': '#30363d',
                    'editorSuggestWidget.selectedBackground': '#1f6feb',
                    'input.background': '#0d1117',
                    'input.border': '#30363d',
                    'scrollbarSlider.background': '#30363d66',
                    'scrollbarSlider.hoverBackground': '#30363d',
                    'scrollbarSlider.activeBackground': '#484f58',
                    'minimap.background': '#0d1117'
                }
            });

            monaco.editor.defineTheme('terminalcode-light', {
                base: 'vs',
                inherit: true,
                rules: [],
                colors: {
                    'editor.background': '#ffffff',
                    'editor.foreground': '#24292f',
                    'editorCursor.foreground': '#24292f',
                    'editorLineNumber.foreground': '#6e7681',
                    'editorLineNumber.activeForeground': '#24292f',
                    'editor.selectionBackground': '#d0d7de',
                    'editor.lineHighlightBackground': '#f6f8fa'
                }
            });

            // Create editor
            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: '',
                language: 'plaintext',
                theme: 'terminalcode-dark',
                fontSize: 14,
                fontFamily: "'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', 'Courier New', monospace",
                fontWeight: '400',
                fontLigatures: true,
                lineHeight: 22,
                letterSpacing: 0,
                minimap: {
                    enabled: true,
                    showSlider: 'mouseover',
                    scale: 1,
                    size: 'proportional'
                },
                scrollBeyondLastLine: false,
                scrollbar: {
                    vertical: 'visible',
                    horizontal: 'visible',
                    verticalScrollbarSize: 10,
                    horizontalScrollbarSize: 10
                },
                renderWhitespace: 'selection',
                bracketPairColorization: {
                    enabled: true
                },
                autoClosingBrackets: 'always',
                autoClosingQuotes: 'always',
                autoIndent: 'full',
                formatOnPaste: true,
                wordWrap: 'off',
                tabSize: 4,
                insertSpaces: true,
                detectIndentation: true,
                roundedSelection: true,
                cursorBlinking: 'smooth',
                cursorSmoothCaretAnimation: 'on',
                smoothScrolling: true,
                padding: {
                    top: 8,
                    bottom: 8
                },
                folding: true,
                foldingHighlight: true,
                foldingStrategy: 'indentation',
                showFoldingControls: 'mouseover',
                unicodeHighlight: {
                    ambiguousCharacters: false
                },
                wordBasedSuggestions: true,
                suggest: {
                    showMethods: true,
                    showFunctions: true,
                    showConstructors: true,
                    showFields: true,
                    showVariables: true,
                    showClasses: true,
                    showStructs: true,
                    showInterfaces: true,
                    showModules: true,
                    showProperties: true,
                    showEvents: true,
                    showOperators: true,
                    showUnits: true,
                    showValues: true,
                    showConstants: true,
                    showEnums: true,
                    showEnumMembers: true,
                    showKeywords: true,
                    showWords: true,
                    showColors: true,
                    showFiles: true,
                    showReferences: true,
                    showSnippets: true
                }
            });

            // ============================================================
            // Monaco Event Handlers
            // ============================================================

            // Track modifications
            editor.onDidChangeModelContent(function(event) {
                if (!isModified && currentFilePath) {
                    isModified = true;
                    notifyModified(true);
                }
            });

            // Cursor position changes
            editor.onDidChangeCursorPosition(function(e) {
                notifyCursorPosition(e.position.lineNumber, e.position.column);
            });

            // ============================================================
            // Android Bridge Methods
            // ============================================================

            /**
             * Set editor content with a file
             */
            function openFile(filePath, content) {
                currentFilePath = filePath;
                const lang = getLanguage(filePath);
                const model = monaco.editor.createModel(content || '', lang);
                if (currentModel) {
                    currentModel.dispose();
                }
                editor.setModel(model);
                currentModel = model;
                isModified = false;
                notifyModified(false);

                // Update tab title
                const fileName = filePath.split('/').pop() || filePath;
                if (window.AndroidBridge) {
                    window.AndroidBridge.onFileOpened(filePath, fileName, lang);
                }
            }

            /**
             * Get current editor content
             */
            function getContent() {
                return editor.getValue();
            }

            /**
             * Set editor content without creating a new model
             */
            function setContent(content) {
                editor.setValue(content);
                isModified = false;
                notifyModified(false);
            }

            /**
             * Get the current file path
             */
            function getCurrentFilePath() {
                return currentFilePath;
            }

            /**
             * Mark editor as saved (reset modified state)
             */
            function markAsSaved() {
                isModified = false;
                notifyModified(false);
            }

            /**
             * Set read-only mode
             */
            function setReadOnly(readonly) {
                readOnly = readonly;
                editor.updateOptions({ readOnly: readonly });
            }

            /**
             * Set font size
             */
            function setFontSize(size) {
                editor.updateOptions({ fontSize: size });
            }

            /**
             * Toggle word wrap
             */
            function toggleWordWrap() {
                const current = editor.getOption(monaco.editor.EditorOption.wordWrap);
                editor.updateOptions({
                    wordWrap: current === 'on' ? 'off' : 'on'
                });
            }

            /**
             * Toggle minimap
             */
            function toggleMinimap() {
                const current = editor.getOption(monaco.editor.EditorOption.minimap);
                editor.updateOptions({
                    minimap: { enabled: !current.enabled }
                });
            }

            /**
             * Undo last action
             */
            function undo() {
                editor.trigger('keyboard', 'undo');
            }

            /**
             * Redo last action
             */
            function redo() {
                editor.trigger('keyboard', 'redo');
            }

            /**
             * Switch editor theme
             */
            function setTheme(themeName) {
                if (themeName === 'light') {
                    monaco.editor.setTheme('terminalcode-light');
                } else {
                    monaco.editor.setTheme('terminalcode-dark');
                }
            }

            /**
             * Find text in editor
             */
            function findText(text) {
                editor.getAction('actions.find').run();
            }

            /**
             * Replace text in editor
             */
            function replaceText() {
                editor.getAction('actions.replace').run();
            }

            /**
             * Format the current document
             */
            function formatDocument() {
                editor.getAction('editor.action.formatDocument').run();
            }

            /**
             * Zoom in
             */
            function zoomIn() {
                const current = editor.getOption(monaco.editor.EditorOption.fontSize);
                editor.updateOptions({ fontSize: Math.min(40, current + 2) });
            }

            /**
             * Zoom out
             */
            function zoomOut() {
                const current = editor.getOption(monaco.editor.EditorOption.fontSize);
                editor.updateOptions({ fontSize: Math.max(8, current - 2) });
            }

            /**
             * Focus the editor
             */
            function focusEditor() {
                editor.focus();
            }

            /**
             * Show line numbers toggle
             */
            function toggleLineNumbers() {
                const current = editor.getOption(monaco.editor.EditorOption.lineNumbers);
                editor.updateOptions({
                    lineNumbers: current === 'on' ? 'off' : 'on'
                });
            }

            // ============================================================
            // Internal notification helpers
            // ============================================================

            function notifyModified(modified) {
                if (window.AndroidBridge) {
                    window.AndroidBridge.onModified(modified);
                }
            }

            function notifyCursorPosition(line, column) {
                if (window.AndroidBridge) {
                    window.AndroidBridge.onCursorPosition(line, column);
                }
            }

            // ============================================================
            // Window Events
            // ============================================================

            window.addEventListener('resize', () => {
                editor.layout();
            });

            // Notify Android that editor is ready
            if (window.AndroidBridge) {
                window.AndroidBridge.onReady();
            }

            console.log('Monaco Editor initialized successfully');
        });
    </script>
</body>
</html>
