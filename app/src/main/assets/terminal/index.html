<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Terminal</title>
    <link href="xterm.min.css" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1117; }
        #terminal-container { width: 100%; height: 100%; padding: 4px; }
        .xterm { height: 100%; }
        .xterm-viewport {
            scrollbar-width: thin;
            scrollbar-color: #30363d transparent;
        }
        .xterm-viewport::-webkit-scrollbar { width: 6px; }
        .xterm-viewport::-webkit-scrollbar-track { background: transparent; }
        .xterm-viewport::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }

        #toolbar {
            display: flex; gap: 4px; padding: 2px 8px;
            background: #161b22; border-bottom: 1px solid #21262d;
        }
        #toolbar button {
            background: #21262d; color: #8b949e;
            border: 1px solid #30363d; border-radius: 4px;
            padding: 2px 8px; font-size: 11px; font-family: monospace;
            cursor: pointer;
        }
        #toolbar button:active { background: #30363d; }

        #keyboard-input {
            position: fixed; bottom: 0; left: 0;
            width: 1px; height: 1px; opacity: 0.01;
            border: none; padding: 0; margin: 0;
            outline: none; resize: none;
        }

        #loading {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #0d1117; color: #8b949e;
            font-family: monospace; font-size: 14px;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
        .loading-spinner {
            width: 24px; height: 24px;
            border: 2px solid #21262d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: #8b949e; font-size: 13px; }
        .loading-error { color: #ff7b72; font-size: 12px; margin-top: 8px; display: none; }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">Starting terminal...</div>
        <div class="loading-error" id="loadingError"></div>
    </div>

    <div id="toolbar">
        <button id="btn-ctrl-c">^C</button>
        <button id="btn-ctrl-d">^D</button>
        <button id="btn-tab">Tab</button>
        <button id="btn-clear">Clear</button>
    </div>

    <textarea id="keyboard-input" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
    <div id="terminal-container"></div>

    <script src="xterm.min.js"></script>
    <script src="xterm-addon-fit.min.js"></script>
    <script src="xterm-addon-web-links.min.js"></script>
    <script src="xterm-addon-search.min.js"></script>

    <script>
        try {
            if (typeof Terminal === 'undefined') {
                throw new Error('xterm.js failed to load');
            }

            const term = new Terminal({
                cursorBlink: true,
                cursorStyle: 'block',
                cursorWidth: 2,
                fontSize: 14,
                fontFamily: "'JetBrains Mono', 'Fira Code', 'Hack', 'Source Code Pro', 'Menlo', 'Courier New', monospace",
                theme: {
                    background: '#0d1117', foreground: '#c9d1d9',
                    cursor: '#c9d1d9', cursorAccent: '#0d1117',
                    selectionBackground: '#3b5998',
                    black: '#484f58', red: '#ff7b72', green: '#3fb950',
                    yellow: '#d29922', blue: '#58a6ff', magenta: '#bc8cff',
                    cyan: '#39c5cf', white: '#b1bac4',
                    brightBlack: '#6e7681', brightRed: '#ffa198',
                    brightGreen: '#56d364', brightYellow: '#e3b341',
                    brightBlue: '#79c0ff', brightMagenta: '#d2a8ff',
                    brightCyan: '#56d4dd', brightWhite: '#f0f6fc'
                },
                allowTransparency: true,
                scrollback: 10000
            });

            const fitAddon = new FitAddon.FitAddon();
            const webLinksAddon = new WebLinksAddon.WebLinksAddon();
            const searchAddon = new SearchAddon.SearchAddon();

            term.loadAddon(fitAddon);
            term.loadAddon(webLinksAddon);
            term.loadAddon(searchAddon);

            const container = document.getElementById('terminal-container');
            term.open(container);
            fitAddon.fit();

            document.getElementById('loading').classList.add('hidden');

            // ============================================================
            // Android Keyboard Capture
            // ============================================================
            const keyboardInput = document.getElementById('keyboard-input');
            let prevLen = 0;

            function openKeyboard() {
                keyboardInput.value = '';
                prevLen = 0;
                keyboardInput.focus();
            }

            keyboardInput.addEventListener('input', function() {
                const cur = this.value;
                const curLen = cur.length;

                // Backspace detected
                if (curLen < prevLen) {
                    for (let i = 0; i < prevLen - curLen; i++) {
                        if (window.TerminalBridge) window.TerminalBridge.onData('\x7f');
                    }
                }

                // New chars typed
                if (curLen > prevLen) {
                    const newChars = cur.substring(prevLen);
                    if (window.TerminalBridge) window.TerminalBridge.onData(newChars);
                }

                prevLen = curLen;
                setTimeout(() => { this.value = ''; prevLen = 0; }, 30);
            });

            keyboardInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    if (window.TerminalBridge) window.TerminalBridge.onData('\n');
                    e.preventDefault();
                    setTimeout(() => { this.value = ''; prevLen = 0; }, 10);
                }
            });

            // Tap to focus
            container.addEventListener('click', function() { openKeyboard(); term.focus(); });
            container.addEventListener('touchstart', function() { openKeyboard(); term.focus(); }, { passive: true });

            // Toolbar buttons
            document.getElementById('btn-ctrl-c').addEventListener('click', function() {
                if (window.TerminalBridge) window.TerminalBridge.onData('\x03');
                openKeyboard();
            });
            document.getElementById('btn-ctrl-d').addEventListener('click', function() {
                if (window.TerminalBridge) window.TerminalBridge.onData('\x04');
                openKeyboard();
            });
            document.getElementById('btn-tab').addEventListener('click', function() {
                if (window.TerminalBridge) window.TerminalBridge.onData('\t');
                openKeyboard();
            });
            document.getElementById('btn-clear').addEventListener('click', function() {
                term.clear();
                openKeyboard();
            });

            // ============================================================
            // Terminal Events
            // ============================================================
            term.onData(data => {
                if (window.TerminalBridge) window.TerminalBridge.onData(data);
            });

            term.onResize(({ cols, rows }) => {
                if (window.TerminalBridge) window.TerminalBridge.onResize(cols, rows);
            });

            term.onTitleChange(title => {
                if (window.TerminalBridge) window.TerminalBridge.onTitle(title);
            });

            window.addEventListener('resize', () => {
                fitAddon.fit();
                const dims = fitAddon.proposeDimensions();
                if (dims && window.TerminalBridge) window.TerminalBridge.onResize(dims.cols, dims.rows);
            });

            // ============================================================
            // Android Callable Functions
            // ============================================================
            function writeToTerminal(data) { term.write(data); }
            function writeBatch(data) {
                for (let i = 0; i < data.length; i += 4096) {
                    term.write(data.substring(i, i + 4096));
                }
            }
            function clearTerminal() { term.clear(); }
            function fitTerminal() { fitAddon.fit(); }
            function focusTerminal() { term.focus(); openKeyboard(); }
            function resetTerminal() { term.reset(); }

            // ============================================================
            // Notify Android
            // ============================================================
            if (window.TerminalBridge) {
                const dims = fitAddon.proposeDimensions();
                window.TerminalBridge.onReady(dims ? dims.cols : 80, dims ? dims.rows : 24);
            }

            setTimeout(function() { openKeyboard(); }, 1000);

        } catch (e) {
            console.error('Terminal error:', e);
            document.getElementById('loadingError').textContent = e.message;
            document.getElementById('loadingError').style.display = 'block';
            document.querySelector('.loading-text').textContent = 'Failed: ' + e.message;
            document.querySelector('.loading-spinner').style.display = 'none';
        }
    </script>
</body>
</html>
